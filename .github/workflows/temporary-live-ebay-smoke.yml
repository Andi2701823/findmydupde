name: Temporary public eBay smoke check
on:
  push:
    branches:
      - test/live-ebay-check-20261024
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check FindMyDup live search and eBay API
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, urllib.parse
          from urllib.parse import urlparse

          def read(url):
              req=urllib.request.Request(url,headers={"User-Agent":"FindMyDupSmokeCheck/1.0","Accept":"application/json, text/html"})
              try:
                  with urllib.request.urlopen(req,timeout=25) as res:
                      return res.status,res.headers,res.read(2000000)
              except urllib.error.HTTPError as e:
                  return e.code,e.headers,e.read(10000)

          base="https://findmydup.de"
          query="Samsung Galaxy S25"
          url=base+"/api/ebay/search/?"+urllib.parse.urlencode({"q":query})
          status,headers,raw=read(url)
          print("API_STATUS",status,"CONTENT_TYPE",headers.get("Content-Type"),"CACHE_CONTROL",headers.get("Cache-Control"))
          try:
              data=json.loads(raw)
          except Exception:
              print("API_RESPONSE_NOT_JSON",raw[:500].decode("utf-8","replace"))
              raise
          if status!=200:
              print("API_ERROR",data.get("error"),"MESSAGE",data.get("message"))
              raise SystemExit("Public eBay API failed")
          items=data.get("items",[])
          print("SOURCE",data.get("source"),"MARKETPLACE",data.get("marketplace"),"QUERY",data.get("query"),"RESULTS",len(items))
          assert data.get("source")=="ebay"
          assert data.get("marketplace")=="EBAY_DE"
          assert items,"No eBay results were returned"
          for i,item in enumerate(items[:3]):
              price=item.get("price")
              currency=item.get("currency")
              image=item.get("imageUrl","")
              outbound=item.get("outboundUrl","")
              print("OFFER",i+1,"TITLE",repr(item.get("title","")[:110]),"PRICE",price,currency,
                    "IMAGE_HOST",urlparse(image).hostname,"SHOP_HOST",urlparse(outbound).hostname,
                    "AFFILIATE",item.get("affiliate"))
              assert isinstance(price,(int,float)) and price>=0
              assert currency=="EUR"
              assert urlparse(image).hostname=="i.ebayimg.com"
              assert urlparse(outbound).hostname in ("ebay.de","www.ebay.de","ebay.com","www.ebay.com") or (urlparse(outbound).hostname or "").endswith(".ebay.de")
          image_status,image_headers,imagedata=read(items[0]["imageUrl"])
          print("FIRST_IMAGE",image_status,image_headers.get("Content-Type"),"BYTES",len(imagedata))
          assert image_status==200
          assert image_headers.get("Content-Type","").startswith("image/")
          pageurl=base+"/suche/?"+urllib.parse.urlencode({"q":query,"source":"ebay"})
          page_status,page_headers,html=read(pageurl)
          print("SEARCH_PAGE_STATUS",page_status,"HTML_BYTES",len(html))
          assert page_status==200
          assert b"eBay" in html
          print("LIVE_EBAY_SMOKE_CHECK_PASS")
          PY
