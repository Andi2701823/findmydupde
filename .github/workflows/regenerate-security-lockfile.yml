name: Temporary security lockfile refresh
on:
  push:
    branches:
      - security/next-react-oct-2026
    paths:
      - .github/workflows/regenerate-security-lockfile.yml
permissions:
  contents: write
jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched dependencies and regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Commit lockfile to security branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: regenerate lockfile for patched dependencies"
            git push origin HEAD:security/next-react-oct-2026
          fi
