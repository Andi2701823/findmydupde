name: Apply verified SEO dependency update
on:
  push:
    branches: [seo/sitewide-fixes]
    paths: ['.github/workflows/seo-dependency-update.yml']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/sitewide-fixes
      - uses: actions/download-artifact@v4
        with:
          name: seo-dependency-update
          run-id: 45656798474
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-seo-update
      - name: Verify and commit only the tested manifest and lockfile
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/verified-seo-update
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          (cd "$ARTIFACT_DIR" && sha256sum -c <<'SUMS'
          c348608926d7e4e8b26f4206802de58e50f922f1340cefba13a1bac2202ed78f  package.json
          b5be6d5e4402c7dc8ad5ec5f726f757e8bafe2345cee9c21cab89320771bd161  package-lock.json
          45fe051e14ab01b1bbd8e4cfb6c36571da80bb4ce46f37c0ef41332d2660ce04  audit-proposed.json
          SUMS
          )
          cp "$ARTIFACT_DIR/package.json" "$ARTIFACT_DIR/package-lock.json" .
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          git commit -m "Apply tested security dependency updates"
          git push origin HEAD:refs/heads/seo/sitewide-fixes
