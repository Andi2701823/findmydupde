name: MySQL preparation verification
on:
  push:
    branches: [backend/mysql-preparation-20261013]
    paths: [.github/workflows/mysql-prepare.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve current stable MySQL dependencies and regenerate lockfile
        run: npm install --save-exact mysql2@3 server-only@0.0.1 --no-fund
      - run: npm ci
      - name: Audit all dependencies with documented upstream exception
        run: |
          npm audit --json > audit-full.json || true
          node <<'JS'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit-full.json', 'utf8'));
          if (!audit.metadata) throw new Error('npm audit did not return a valid report');
          const allowed = new Set(['braces', 'chokidar', 'micromatch', 'fast-glob', 'tailwindcss', '@next/eslint-plugin-next', 'eslint-config-next']);
          const advisory = 'https://github.com/advisories/GHSA-vfj7-8cjw-p6xm';
          for (const finding of Object.values(audit.vulnerabilities || {})) {
            if (!allowed.has(finding.name) || finding.severity !== 'high' || finding.via.some(v => typeof v === 'string' ? !allowed.has(v) : v.url !== advisory)) {
              throw new Error('New or undocumented vulnerability: ' + finding.name);
            }
          }
          console.log('FULL_AUDIT', JSON.stringify(audit.metadata.vulnerabilities));
          console.log('Only the documented, currently unpatched braces development-tool dependency chain is allowed. Production is audited separately without exceptions.');
          JS
      - name: Audit production dependencies without exceptions
        run: npm audit --omit=dev --json > audit-production.json
      - run: npm run check
      - name: Install browser for smoke tests
        run: npx playwright-core install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: hostinger-static-site
          path: out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-reports
          path: audit-*.json
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_ephemeral_root_password
          MYSQL_DATABASE: findmydup_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_ephemeral_root_password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TEST_MYSQL_INTEGRATION_ENABLED: "true"
      DATABASE_ACCESS_ENABLED: "true"
      DB_MIGRATIONS_ENABLED: "true"
      AWIN_IMPORT_ENABLED: "true"
      CATALOG_SEARCH_ENABLED: "true"
      IMAGE_SEARCH_ENABLED: "false"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: findmydup_test
      MYSQL_USER: findmydup_test_read
      MYSQL_PASSWORD: ci_ephemeral_read_password
      MYSQL_MIGRATION_USER: root
      MYSQL_MIGRATION_PASSWORD: ci_ephemeral_root_password
      MYSQL_IMPORT_USER: findmydup_test_import
      MYSQL_IMPORT_PASSWORD: ci_ephemeral_import_password
      MYSQL_TLS_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve current stable MySQL dependencies and regenerate lockfile
        run: npm install --save-exact mysql2@3 server-only@0.0.1 --no-fund
      - run: npm ci
      - name: Build existing static website without database access
        run: npm run build
        env:
          DATABASE_ACCESS_ENABLED: "false"
          DB_MIGRATIONS_ENABLED: "false"
          AWIN_IMPORT_ENABLED: "false"
          CATALOG_SEARCH_ENABLED: "false"
      - name: Build separate standalone server without database access
        run: npm run build:server
        env:
          DATABASE_ACCESS_ENABLED: "false"
          DB_MIGRATIONS_ENABLED: "false"
          AWIN_IMPORT_ENABLED: "false"
          CATALOG_SEARCH_ENABLED: "false"
      - name: Test migrations and imports only against isolated CI MySQL
        run: npm run test:db
      - name: Verify server build and MySQL API
        run: |
          npx playwright-core install chromium
          npm run test:server
      - name: Commit tested MySQL dependencies to verification branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Lock tested MySQL server dependencies"
          git push origin HEAD:backend/mysql-preparation-20261013
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-browser-evidence
          path: test-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: hostinger-standalone-server
          path: server-app/.next/standalone/

